; PAPER CUP — limites PHP pour l'envoi de pièces jointes (PHP-FPM / CGI ; ignoré par mod_php).
; L'API lit les valeurs EFFECTIVES au moment de la requête (GET api/demande.php) : si l'hébergeur
; impose d'autres limites, ce sont elles qui s'affichent dans les formulaires.
file_uploads = On
upload_max_filesize = 10M
post_max_size = 30M
max_file_uploads = 10
display_errors = Off
